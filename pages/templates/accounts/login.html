{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول</title>
    <link rel="stylesheet" href="{% static 'pages/css/style.css' %}">
</head>
<body class="day">
    <div style="max-width: 450px; margin: 40px auto;" class="card">
        <h2>تسجيل الدخول 🔑</h2>
        <hr style="opacity:0.2; margin-bottom:20px;">
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn">دخول</button>
        </form>
        <br>
        <a href="{% url 'accounts:register' %}">ليس لديك حساب؟ أنشئ حسابك الآن</a>
    </div>
</body>
</html>
